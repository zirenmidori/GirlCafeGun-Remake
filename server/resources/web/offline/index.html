<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,user-scalable=no"
    />
    <title>Not in the offline build</title>
    <!--
      Local page for the web windows whose page is gone and has no local copy: Help and
      Glossary in the settings of the game.
    -->
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: #f3f5f8;
        color: #2b3038;
        font:
          15px/1.7 "Roboto",
          "Noto Sans",
          "Helvetica Neue",
          Arial,
          sans-serif;
        display: -webkit-flex;
        display: flex;
        -webkit-align-items: center;
        align-items: center;
        -webkit-justify-content: center;
        justify-content: center;
      }
      .box {
        max-width: 560px;
        margin: 16px;
        background: #fff;
        border-radius: 4px;
        padding: 20px 24px;
        box-shadow: 0 1px 2px rgba(30, 40, 60, 0.1);
      }
      h1 {
        font-size: 19px;
        margin: 0 0 10px;
        color: #0b7bb0;
      }
      .tip {
        color: #5f6b7a;
        font-size: 12px;
        margin: 14px 0 0;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>This page is not in the offline build</h1>
      <p>
        The publisher's web page for this window is gone, and the offline build has no
        copy of it.
      </p>
      <p class="tip">The game itself is not affected. Close this window to continue.</p>
    </div>
  </body>
</html>
